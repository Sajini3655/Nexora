services:
  - type: web
    name: nexora-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: standard
    
    # Environment variables
    envVars:
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: "https://nexora-three-peach.vercel.app"
      - key: INBOUND_EMAIL_API_KEY
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "true"

databases:
  - name: nexora-db
    databaseName: nexora_prod
    plan: standard
